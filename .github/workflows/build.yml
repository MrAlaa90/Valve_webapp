name: Windows Desktop Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DESKTOP_MODE: 'True'
      USE_SQLITE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller waitress

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Build standalone application with PyInstaller
        run: pyinstaller --clean --noconfirm ValveWorkshop.spec

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          filepath: installer_setup.iss

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ValveWorkshop-Windows
          path: |
            dist/ValveWorkshop/
            dist_installer/*.exe
          if-no-files-found: error
